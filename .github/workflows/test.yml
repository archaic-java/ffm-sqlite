name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ffm-sqlite
    steps:
      - name: Check out provider
        uses: actions/checkout@v7
        with:
          path: ffm-sqlite
          persist-credentials: false
      - name: Check out catalog contract
        uses: actions/checkout@v7
        with:
          repository: archaic-java/service-catalog
          ref: 474d272cf603e8edc1713f07f10e5a29b2022373
          path: service-catalog
          persist-credentials: false
      - name: Check out Minau runner
        uses: actions/checkout@v7
        with:
          repository: archaic-java/minau
          ref: 7abc609a7092dc6491d9af299499cfe434ad7f23
          path: minau
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile
        run: javac @cmd/compile
      - name: Test
        run: java @cmd/test
