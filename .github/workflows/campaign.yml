name: SQLite campaigns

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      campaign:
        description: Campaign to run
        type: choice
        options: [both, model, crash]
        default: both
      seed:
        description: Signed 64-bit model/crash seed
        type: string
        default: '20260924'
      iterations:
        description: Model operations (1..10000)
        type: string
        default: '1000'
      crash_samples:
        description: Timing samples near commit (0..100)
        type: string
        default: '20'

permissions:
  contents: read

jobs:
  campaigns:
    name: Campaigns ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-22.04-arm, ubuntu-24.04-arm]
    defaults:
      run:
        working-directory: ffm-sqlite
    env:
      CAMPAIGN: ${{ inputs.campaign || 'both' }}
      MODEL_SEED: ${{ inputs.seed || '20260924' }}
      MODEL_ITERATIONS: ${{ inputs.iterations || '1000' }}
      CRASH_SAMPLES: ${{ inputs.crash_samples || '20' }}
    steps:
      - name: Validate dispatch inputs
        working-directory: .
        run: |
          set -euo pipefail
          [[ "$CAMPAIGN" == both || "$CAMPAIGN" == model || "$CAMPAIGN" == crash ]]
          [[ "$MODEL_SEED" =~ ^-?[0-9]{1,19}$ ]]
          [[ "$MODEL_ITERATIONS" =~ ^[0-9]{1,5}$ ]]
          (( 10#$MODEL_ITERATIONS >= 1 && 10#$MODEL_ITERATIONS <= 10000 ))
          [[ "$CRASH_SAMPLES" =~ ^[0-9]{1,3}$ ]]
          (( 10#$CRASH_SAMPLES >= 0 && 10#$CRASH_SAMPLES <= 100 ))
      - name: Check out provider
        uses: actions/checkout@v7
        with:
          path: ffm-sqlite
          persist-credentials: false
      - name: Check out tested catalog
        uses: actions/checkout@v7
        with:
          repository: archaic-java/service-catalog
          ref: 85b5d00e341d52abdc7b2fca32d8a8f888309767
          path: service-catalog
          persist-credentials: false
      - name: Check out tested Minau
        uses: actions/checkout@v7
        with:
          repository: archaic-java/minau
          ref: 890647065e1250ef3b628bf292b3d78d22f4024a
          path: minau
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile
        run: javac @cmd/compile
      - name: Record actual SQLite environment
        run: |
          set -euo pipefail
          uname -m
          java @cmd/sqlite-info | tee ci-environment.txt
      - name: Model campaign
        if: ${{ env.CAMPAIGN == 'both' || env.CAMPAIGN == 'model' }}
        run: |
          set -euo pipefail
          java "-Dsqlite.model.seed=$MODEL_SEED" "-Dsqlite.model.iterations=$MODEL_ITERATIONS" \
            @cmd/model 2>&1 | tee ci-model.log
      - name: Crash campaign
        if: ${{ env.CAMPAIGN == 'both' || env.CAMPAIGN == 'crash' }}
        run: |
          set -euo pipefail
          java "-Dsqlite.crash.seed=$MODEL_SEED" "-Dsqlite.crash.samples=$CRASH_SAMPLES" \
            @cmd/crash 2>&1 | tee ci-crash.log
      - name: Retain synthetic failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-campaign-${{ matrix.runner }}-${{ github.run_id }}
          path: |
            ffm-sqlite/ci-environment.txt
            ffm-sqlite/ci-model.log
            ffm-sqlite/ci-crash.log
            /tmp/ffm-sqlite-*
            /tmp/sqlite-conformance-*
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
